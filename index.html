<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मिशन निपुण बीड - सर्वंकष शाळा भेट व पर्यवेक्षण प्रपत्र</title>
<style>
  :root{
    --navy:#1c2b4a;
    --navy2:#24365c;
    --accent:#2f5aa8;
    --accent-light:#eaf0fb;
    --border:#d3d9e6;
    --bg:#f4f6fb;
    --ok:#1e8e5a;
    --pending:#c67c00;
    --danger:#c0392b;
    --text:#1c2230;
    --fs-scale:1;
  }
  html{
    font-size: calc(clamp(14.5px, 3.6vw + 10px, 18px) * var(--fs-scale));
    -webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0; font-size:1rem;
    font-family:'Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif, system-ui;
    background:var(--bg);
    color:var(--text);
    padding-bottom:100px;
    -webkit-font-smoothing:antialiased;
  }
  header.topbar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
    color:#fff;
    padding:0.9rem 1rem;
    position:sticky; top:0; z-index:50;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header.topbar h1{ margin:0; font-size:1.05rem; line-height:1.4; letter-spacing:.2px;}
  header.topbar p{ margin:2px 0 0; font-size:0.78rem; opacity:.85;}
  .status-strip{
    display:flex; align-items:center; gap:8px; margin-top:8px; font-size:0.78rem; flex-wrap:wrap;
  }
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot.on{background:#4CD46C;}
  .dot.off{background:#e05555;}
  .fontctl-group{ display:flex; align-items:center; gap:4px; margin-left:auto; }
  .fontctl{
    appearance:none; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08);
    color:#fff; border-radius:6px; padding:3px 8px; font-size:0.72rem; font-weight:700;
    line-height:1.4; cursor:pointer;
  }
  .fontctl:active{ background:rgba(255,255,255,.22); }
  #pendingCountWrap{ order:3; width:100%; }
  @media (min-width:420px){ #pendingCountWrap{ order:0; width:auto; margin-left:8px; } .fontctl-group{ margin-left:auto; } }
  .tabbar{
    display:flex; background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:64px; z-index:40; overflow-x:auto;
  }
  .tabbar button{
    flex:1; padding:12px 8px; border:none; background:none; font-size:0.85rem;
    color:#555; border-bottom:3px solid transparent; white-space:nowrap; cursor:pointer;
  }
  .tabbar button.active{ color:var(--navy); border-color:var(--accent); font-weight:700;}
  main{padding:12px;max-width:760px;margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}
  .subview{display:none;}
  .subview.active{display:block;}
